name: Lint Project

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            wget \
            unzip \
            bzip2 \
            libgl1 \
            libglib2.0-0 \
            libstdc++6 \
            ca-certificates

      - name: Download Ren'Py SDK
        run: |
          wget https://www.renpy.org/dl/8.5.2/renpy-8.5.2-sdk.tar.bz2
          tar -xjf renpy-8.5.2-sdk.tar.bz2

      - name: Run Ren'Py lint
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          renpy-8.5.2-sdk/renpy.sh . lint
